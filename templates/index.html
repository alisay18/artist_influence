<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>Campaign Dashboard</title>
  </head>
  <body>
    <div class="container">
      <h1 class="mt-5">Campaign Dashboard</h1>
      <form action="/upload" method="post" enctype="multipart/form-data">
        <div class="form-group">
          <label for="file">Upload CSV</label>
          <input type="file" class="form-control-file" id="file" name="file">
        </div>
        <button type="submit" class="btn btn-primary">Upload</button>
      </form>
      <h2 class="mt-5">Campaigns</h2>
      <div>{{ tables | safe }}</div>
      <a href="/start" class="btn btn-success">Start All Campaigns</a>
      <a href="/stop" class="btn btn-danger">Stop All Campaigns</a>
      <a href="/export" class="btn btn-info">Export Report</a>
    </div>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  </body>
</html>
